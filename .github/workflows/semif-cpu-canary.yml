name: SemIf CPU canary

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: typed-decision-semif-cpu-canary
  cancel-in-progress: false

jobs:
  runtime-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QWEN_BASE: Qwen/Qwen3-0.6B
      QWEN_BASE_REV: c1899de289a04d12100db370d81485cdf75e47ca
      GGUF_REPO: Qwen/Qwen3-0.6B-GGUF
      GGUF_REV: 23749fefcc72300e3a2ad315e1317431b06b590a
      GGUF_FILE: Qwen3-0.6B-Q8_0.gguf
      MODEL_DIR: .cache/model
      ARTIFACT_DIR: artifacts

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout pinned package mechanics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TeaShaman-cyber/marcopolo-cookbook
          ref: 821e1cf04dfdfa42ada18255677175203bbab7df
          path: .shared/marcopolo-cookbook
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Deterministic repository QA
        run: tools/dev/check

      - name: Capture runner
        run: python3 scripts/capture_runtime.py "$ARTIFACT_DIR/runtime.json"

      - name: Prepare verified SemIf runtime package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/prepare_runtime_package.py \
            --profile config/runtime-profiles.json \
            --profile-key semif \
            --cookbook-root .shared/marcopolo-cookbook \
            --archive "$RUNNER_TEMP/semif-toolchain.zip" \
            --staging-dir "$RUNNER_TEMP/semif-staging" \
            --runtime-dir "$RUNNER_TEMP/semif-runtime" \
            --out "$ARTIFACT_DIR/runtime-package-receipt.json"
          echo "PYTHONPATH=$RUNNER_TEMP/semif-runtime/site-packages" >> "$GITHUB_ENV"

      - name: Download pinned GGUF
        run: |
          mkdir -p "$MODEL_DIR"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          path = hf_hub_download(
              repo_id=os.environ["GGUF_REPO"],
              filename=os.environ["GGUF_FILE"],
              revision=os.environ["GGUF_REV"],
              local_dir=os.environ["MODEL_DIR"],
          )
          print(path)
          PY

      - name: Verify pinned GGUF checksum
        run: |
          set -euo pipefail
          expected=$(jq -r '.sources.qwen3_0_6b_gguf.sha256' config/upstreams.json)
          test "$expected" != "null"
          test "${#expected}" -eq 64
          printf '%s  %s\n' "$expected" "$MODEL_DIR/$GGUF_FILE" | sha256sum -c -

      - name: Score smoke fixture
        run: |
          start_ms=$(date +%s%3N)
          python -m semif_phase1.cli \
            --mode direct \
            --backend llamacpp \
            --model "$QWEN_BASE" \
            --revision "$QWEN_BASE_REV" \
            --gguf "$MODEL_DIR/$GGUF_FILE" \
            --llama-threads 4 \
            --max-tokens 2048 \
            --input fixtures/smoke/semif-native.jsonl \
            --output "$ARTIFACT_DIR/semif-output.jsonl"
          end_ms=$(date +%s%3N)
          echo "DURATION_MS=$((end_ms-start_ms))" >> "$GITHUB_ENV"

      - name: Write runtime receipt
        run: |
          python3 scripts/write_runtime_receipt.py \
            --output "$ARTIFACT_DIR/semif-output.jsonl" \
            --runtime "$ARTIFACT_DIR/runtime.json" \
            --runtime-package "$ARTIFACT_DIR/runtime-package-receipt.json" \
            --fixture fixtures/smoke/semif-native.jsonl \
            --gguf "$MODEL_DIR/$GGUF_FILE" \
            --upstreams config/upstreams.json \
            --out "$ARTIFACT_DIR/runtime-receipt.json"

      - name: Upload receipt and raw outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semif-cpu-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/runtime.json
            artifacts/runtime-package-receipt.json
            artifacts/semif-output.jsonl
            artifacts/runtime-receipt.json
          if-no-files-found: error
          retention-days: 14
