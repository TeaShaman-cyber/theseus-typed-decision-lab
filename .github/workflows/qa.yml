name: Repository QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dev-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workflow YAML parser
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
      - name: Validate workflow YAML syntax
        run: python scripts/check_workflow_yaml.py
      - run: tools/dev/check
