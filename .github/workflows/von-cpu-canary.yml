name: Von CPU feasibility

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typed-decision-von-cpu-feasibility
  cancel-in-progress: false

jobs:
  cpu-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VON_SOURCE_REV: 62c0725a85060e6e0e9d4d8f2aa91b363930d767
      VON_MODEL_REPO: wfzyx/von
      VON_MODEL_REV: 5df8185a4f2327ad0a7cd117cc4f701ac557b9ae
      FIXTURE_ID: orchestration-pending-results-v1
      MODEL_DIR: .cache/von-model
      ARTIFACT_DIR: artifacts

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Deterministic repository QA
        run: tools/dev/check

      - name: Capture runner
        run: python3 scripts/capture_runtime.py "$ARTIFACT_DIR/runtime.json"

      - name: Install pinned Von CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          start_ms=$(date +%s%3N)
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            "torch==2.10.0+cpu"
          python -m pip install -r requirements/von-cpu-runtime.txt
          python -m pip install --no-deps \
            "von-sdk @ git+https://github.com/wfzyx/von.git@$VON_SOURCE_REV"
          end_ms=$(date +%s%3N)
          echo "INSTALL_MS=$((end_ms-start_ms))" >> "$GITHUB_ENV"
          python -m pip freeze | sort > "$ARTIFACT_DIR/pip-freeze.txt"

      - name: Download and verify exact Von model snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi, snapshot_download

          repo = os.environ["VON_MODEL_REPO"]
          revision = os.environ["VON_MODEL_REV"]
          info = HfApi().model_info(repo, revision=revision)
          if info.sha != revision:
              raise SystemExit(f"model revision mismatch: {info.sha} != {revision}")
          path = snapshot_download(
              repo_id=repo,
              revision=os.environ["VON_MODEL_REV"],
              local_dir=os.environ["MODEL_DIR"],
              allow_patterns=[
                  "config.json",
                  "model.safetensors",
                  "option_marker.pt",
                  "marker_calibration.json",
                  "tokenizer.json",
                  "tokenizer_config.json",
              ],
          )
          print(path)
          PY

      - name: Run pinned Von CPU feasibility probe
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          python3 scripts/run_von_cpu_canary.py \
            --checkpoint "$MODEL_DIR" \
            --fixture "fixtures/advisory/$FIXTURE_ID.json" \
            --source-revision "$VON_SOURCE_REV" \
            --model-revision "$VON_MODEL_REV" \
            --out "$ARTIFACT_DIR/von-runtime-receipt.json"

      - name: Write execution metadata
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          target = Path("artifacts/von-execution.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps({
              "schema": "theseus.von-execution.v1",
              "claim_scope": "RUNTIME_FEASIBILITY_ONLY",
              "repository_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "von_source_revision": os.environ["VON_SOURCE_REV"],
              "von_model_revision": os.environ["VON_MODEL_REV"],
              "fixture_id": os.environ["FIXTURE_ID"],
              "install_ms": int(os.environ["INSTALL_MS"]) if os.environ.get("INSTALL_MS") else None,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload feasibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: von-cpu-feasibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/runtime.json
            artifacts/von-runtime-receipt.json
            artifacts/von-execution.json
            artifacts/pip-freeze.txt
          if-no-files-found: warn
          retention-days: 14
