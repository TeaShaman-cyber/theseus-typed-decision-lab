name: Quasi-Jev advisory council

on:
  workflow_dispatch:
    inputs:
      fixture_id:
        description: Registered public/synthetic advisory fixture
        required: true
        type: choice
        options:
          - orchestration-pending-results-v1
          - math-roadmap-parallel-v1
          - math-roadmap-compact-v1
          - math-roadmap-compact-abstain-v1
          - math-mutation-routing-v1
          - math-capability-routing-v1

permissions:
  contents: read
  actions: read

concurrency:
  group: quasi-jev-advisory-${{ inputs.fixture_id }}
  cancel-in-progress: false

jobs:
  gate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          remote=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')
          test "$remote" = "$GITHUB_SHA"
          echo "EXACT_MAIN_GATE_PASS=$remote"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Deterministic repository QA
        run: tools/dev/check
      - name: Validate registered fixture
        run: python3 scripts/quasi_jev_advisory.py prepare-semif --fixture-id '${{ inputs.fixture_id }}' --out "$RUNNER_TEMP/fixture.jsonl"

  semif:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QWEN_BASE: Qwen/Qwen3-0.6B
      QWEN_BASE_REV: c1899de289a04d12100db370d81485cdf75e47ca
      GGUF_REPO: Qwen/Qwen3-0.6B-GGUF
      GGUF_REV: 23749fefcc72300e3a2ad315e1317431b06b590a
      GGUF_FILE: Qwen3-0.6B-Q8_0.gguf
      MODEL_DIR: .cache/model
      ARTIFACT_DIR: artifacts/semif
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout pinned package mechanics
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TeaShaman-cyber/marcopolo-cookbook
          ref: 821e1cf04dfdfa42ada18255677175203bbab7df
          path: .shared/marcopolo-cookbook
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare verified SemIf runtime package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          python3 scripts/prepare_runtime_package.py \
            --profile config/runtime-profiles.json \
            --profile-key semif \
            --cookbook-root .shared/marcopolo-cookbook \
            --archive "$RUNNER_TEMP/semif-toolchain.zip" \
            --staging-dir "$RUNNER_TEMP/semif-staging" \
            --runtime-dir "$RUNNER_TEMP/semif-runtime" \
            --out "$ARTIFACT_DIR/runtime-package-receipt.json"
          echo "PYTHONPATH=$RUNNER_TEMP/semif-runtime/site-packages" >> "$GITHUB_ENV"
      - name: Download and verify pinned GGUF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          print(hf_hub_download(
              repo_id=os.environ['GGUF_REPO'], filename=os.environ['GGUF_FILE'],
              revision=os.environ['GGUF_REV'], local_dir=os.environ['MODEL_DIR']))
          PY
          expected=$(jq -r '.sources.qwen3_0_6b_gguf.sha256' config/upstreams.json)
          printf '%s  %s\n' "$expected" "$MODEL_DIR/$GGUF_FILE" | sha256sum -c -
      - name: Prepare registered SemIf request
        run: |
          python3 scripts/quasi_jev_advisory.py prepare-semif \
            --fixture-id '${{ inputs.fixture_id }}' \
            --out "$ARTIFACT_DIR/request.jsonl"
      - name: Prepare SemIf question custody
        run: |
          python3 scripts/quasi_jev_advisory.py prepare-custody \
            --fixture-id '${{ inputs.fixture_id }}' \
            --out "$ARTIFACT_DIR/question-custody.json"
      - name: Ask SemIf consultant
        run: |
          python -m semif_phase1.cli \
            --mode direct \
            --backend llamacpp \
            --model "$QWEN_BASE" \
            --revision "$QWEN_BASE_REV" \
            --gguf "$MODEL_DIR/$GGUF_FILE" \
            --llama-threads 4 \
            --max-tokens 2048 \
            --input "$ARTIFACT_DIR/request.jsonl" \
            --output "$ARTIFACT_DIR/raw-output.jsonl"
      - name: Normalize advisory receipt
        run: |
          python3 scripts/quasi_jev_advisory.py normalize-semif \
            --fixture-id '${{ inputs.fixture_id }}' \
            --raw "$ARTIFACT_DIR/raw-output.jsonl" \
            --runtime-package "$ARTIFACT_DIR/runtime-package-receipt.json" \
            --custody "$ARTIFACT_DIR/question-custody.json" \
            --out "$ARTIFACT_DIR/candidate-receipt.json"
      - name: Upload SemIf advisory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quasi-jev-semif-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/semif/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  kev:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ARTIFACT_DIR: artifacts/kev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact pinned Kev CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          code_rev=$(jq -r '.sources.kev.revision' config/upstreams.json)
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            -r requirements/kev-cpu-runtime.txt
          python -m pip install --no-deps \
            "kev @ git+https://github.com/jaredpalmer/kev.git@${code_rev}"
      - name: Prepare registered Kev request
        run: |
          mkdir -p "$ARTIFACT_DIR"
          python3 scripts/quasi_jev_advisory.py prepare-kev \
            --fixture-id '${{ inputs.fixture_id }}' \
            --out "$ARTIFACT_DIR/request.json"
      - name: Prepare Kev question custody
        run: |
          python3 scripts/quasi_jev_advisory.py prepare-custody \
            --fixture-id '${{ inputs.fixture_id }}' \
            --out "$ARTIFACT_DIR/question-custody.json"
      - name: Ask Kev consultant
        shell: bash
        run: |
          set -euo pipefail
          model_rev=$(jq -r '.sources.kev_0_8b.revision' config/upstreams.json)
          python3 scripts/run_kev_cpu_canary.py \
            --checkpoint "jaredpalmer/kev-0.8b@${model_rev}" \
            --fixture "$ARTIFACT_DIR/request.json" \
            --threads 4 \
            --out "$ARTIFACT_DIR/raw-runtime-receipt.json"
      - name: Normalize advisory receipt
        run: |
          python3 scripts/quasi_jev_advisory.py normalize-kev \
            --fixture-id '${{ inputs.fixture_id }}' \
            --raw "$ARTIFACT_DIR/raw-runtime-receipt.json" \
            --custody "$ARTIFACT_DIR/question-custody.json" \
            --out "$ARTIFACT_DIR/candidate-receipt.json"
      - name: Upload Kev advisory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quasi-jev-kev-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/kev/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  von:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VON_SOURCE_REV: 62c0725a85060e6e0e9d4d8f2aa91b363930d767
      VON_MODEL_REPO: wfzyx/von
      VON_MODEL_REV: 5df8185a4f2327ad0a7cd117cc4f701ac557b9ae
      MODEL_DIR: .cache/von-model
      ARTIFACT_DIR: artifacts/von
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact pinned Von CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            "torch==2.10.0+cpu"
          python -m pip install -r requirements/von-cpu-runtime.txt
          python -m pip install --no-deps \
            "von-sdk @ git+https://github.com/wfzyx/von.git@$VON_SOURCE_REV"
      - name: Download and verify exact Von model snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR" "$ARTIFACT_DIR"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi, snapshot_download
          repo = os.environ['VON_MODEL_REPO']
          revision = os.environ['VON_MODEL_REV']
          info = HfApi().model_info(repo, revision=revision)
          if info.sha != revision:
              raise SystemExit(f'model revision mismatch: {info.sha} != {revision}')
          snapshot_download(
              repo_id=repo,
              revision=revision,
              local_dir=os.environ['MODEL_DIR'],
              allow_patterns=[
                  'config.json', 'model.safetensors', 'option_marker.pt',
                  'marker_calibration.json', 'tokenizer.json', 'tokenizer_config.json',
              ],
          )
          PY
      - name: Prepare Von question custody
        run: |
          python3 scripts/quasi_jev_advisory.py prepare-custody \
            --fixture-id '${{ inputs.fixture_id }}' \
            --out "$ARTIFACT_DIR/question-custody.json"
      - name: Ask Von consultant
        shell: bash
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          set -euo pipefail
          python3 scripts/run_von_cpu_canary.py \
            --checkpoint "$MODEL_DIR" \
            --fixture "fixtures/advisory/${{ inputs.fixture_id }}.json" \
            --source-revision "$VON_SOURCE_REV" \
            --model-revision "$VON_MODEL_REV" \
            --out "$ARTIFACT_DIR/raw-runtime-receipt.json"
      - name: Normalize advisory receipt
        run: |
          python3 scripts/quasi_jev_advisory.py normalize-von \
            --fixture-id '${{ inputs.fixture_id }}' \
            --raw "$ARTIFACT_DIR/raw-runtime-receipt.json" \
            --custody "$ARTIFACT_DIR/question-custody.json" \
            --out "$ARTIFACT_DIR/candidate-receipt.json"
      - name: Upload Von advisory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quasi-jev-von-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/von/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  aggregate:
    needs: [gate, semif, kev, von]
    if: ${{ always() && needs.gate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download SemIf evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quasi-jev-semif-${{ github.run_id }}-${{ github.run_attempt }}
          path: _council/semif
      - name: Download Kev evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quasi-jev-kev-${{ github.run_id }}-${{ github.run_attempt }}
          path: _council/kev
      - name: Download Von evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: quasi-jev-von-${{ github.run_id }}-${{ github.run_attempt }}
          path: _council/von
      - name: Aggregate advisory-only council
        env:
          SEMIF_JOB: ${{ needs.semif.result }}
          KEV_JOB: ${{ needs.kev.result }}
          VON_JOB: ${{ needs.von.result }}
        run: |
          mkdir -p _council/aggregate
          python3 scripts/quasi_jev_advisory.py aggregate \
            --fixture-id '${{ inputs.fixture_id }}' \
            --semif _council/semif/candidate-receipt.json \
            --kev _council/kev/candidate-receipt.json \
            --von _council/von/candidate-receipt.json \
            --semif-job-status "$SEMIF_JOB" \
            --kev-job-status "$KEV_JOB" \
            --von-job-status "$VON_JOB" \
            --out _council/aggregate/council-receipt.json
          cat _council/aggregate/council-receipt.json
      - name: Upload aggregate council receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quasi-jev-council-${{ github.run_id }}-${{ github.run_attempt }}
          path: _council/aggregate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
