name: Build SemIf CPU toolchain

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typed-decision-semif-toolchain-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SEMIF_REV: 1f2dea3e25379f9dfc98cb83c324f00ab5deda37
      TORCH_VERSION: 2.10.0+cpu
      LLAMA_CPP_VERSION: 0.3.35

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Define runtime paths
        shell: bash
        run: |
          {
            echo "PACKAGE_ROOT=$RUNNER_TEMP/semif-cpu-toolchain"
            echo "WHEEL_DIR=$RUNNER_TEMP/semif-wheels"
            echo "OUT_DIR=$RUNNER_TEMP/semif-package-out"
          } >> "$GITHUB_ENV"

      - name: Deterministic repository QA
        run: tools/dev/check

      - name: Build pinned source wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WHEEL_DIR"
          python -m pip wheel --no-deps --wheel-dir "$WHEEL_DIR" \
            "llama-cpp-python==$LLAMA_CPP_VERSION"
          python -m pip wheel --no-deps --wheel-dir "$WHEEL_DIR" \
            "semif-phase1 @ git+https://github.com/TheoLeeCJ/SemIf-OpenJev.git@$SEMIF_REV"

      - name: Materialize CPU-only runtime tree
        shell: bash
        run: |
          set -euo pipefail
          site="$PACKAGE_ROOT/site-packages"
          mkdir -p "$site"

          python -m pip install --target "$site" \
            --require-hashes \
            --only-binary=:all: \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            -r requirements/semif-cpu-runtime.lock.txt

          python -m pip install --target "$site" --no-deps \
            "$WHEEL_DIR"/llama_cpp_python-0.3.35-*.whl \
            "$WHEEL_DIR"/semif_phase1-0.1.0-*.whl

      - name: Validate CPU-only runtime
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PACKAGE_ROOT/site-packages"
          python - <<'PY'
          import importlib.metadata
          import os
          import torch
          import transformers
          import llama_cpp
          import semif_phase1

          assert torch.__version__ == "2.10.0+cpu", torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
          site = os.path.join(os.environ["PACKAGE_ROOT"], "site-packages")
          names = {
              d.metadata["Name"].lower().replace("_", "-")
              for d in importlib.metadata.distributions(path=[site])
              if d.metadata.get("Name")
          }
          forbidden = sorted(n for n in names if n.startswith("nvidia-") or n == "triton")
          assert not forbidden, forbidden
          print("CPU_RUNTIME_OK")
          print("torch", torch.__version__)
          print("transformers", transformers.__version__)
          print("llama_cpp", importlib.metadata.version("llama-cpp-python"))
          print("semif", importlib.metadata.version("semif-phase1"))
          PY
          python -m semif_phase1.cli --help >/dev/null

      - name: Write build receipt
        shell: bash
        run: |
          set -euo pipefail
          python scripts/write_toolchain_receipt.py \
            --site-packages "$PACKAGE_ROOT/site-packages" \
            --source-revision "$SEMIF_REV" \
            --lock requirements/semif-cpu-runtime.lock.txt \
            --output "$PACKAGE_ROOT/build-receipt.json"

      - name: Pack immutable runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          tarball="$OUT_DIR/semif-cpu-toolchain.tar.gz"
          tar -C "$PACKAGE_ROOT" -czf "$tarball" .
          (
            cd "$OUT_DIR"
            sha256sum "semif-cpu-toolchain.tar.gz" > "semif-cpu-toolchain.tar.gz.sha256"
            cat "semif-cpu-toolchain.tar.gz.sha256"
          )

      - name: Upload toolchain package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semif-cpu-toolchain-1f2dea3e25379f9dfc98cb83c324f00ab5deda37-py311-linux-x86_64
          path: |
            ${{ runner.temp }}/semif-package-out/semif-cpu-toolchain.tar.gz
            ${{ runner.temp }}/semif-package-out/semif-cpu-toolchain.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
