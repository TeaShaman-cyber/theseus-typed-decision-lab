name: AnyJev HBR-1 historical blind replay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typed-decision-anyjev-hbr1
  cancel-in-progress: false

jobs:
  hbr1:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANYJEV_SOURCE_REV: 10d5db91dda38dbde74c6abc1c075ce6463723d1
      BASE_MODEL_REPO: Qwen/Qwen3-0.6B
      BASE_MODEL_REV: c1899de289a04d12100db370d81485cdf75e47ca
      MODEL_DIR: .cache/anyjev-hbr1-model
      ANYJEV_DIR: vendor/AnyJev
      ARTIFACT_DIR: artifacts
      HBR1_MANIFEST: fixtures/anyjev/hbr1/manifest.json
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Deterministic repository QA
        run: tools/dev/check

      - name: Capture runner
        run: python3 scripts/capture_runtime.py "$ARTIFACT_DIR/runtime.json"

      - name: Install pinned AnyJev CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          start_ms=$(date +%s%3N)

          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple \
            "torch==2.10.0+cpu"

          python -m pip install -r requirements/anyjev-cpu-runtime.txt

          rm -rf "$ANYJEV_DIR"
          git clone --filter=blob:none https://github.com/nokia-applied-research/AnyJev.git "$ANYJEV_DIR"
          git -C "$ANYJEV_DIR" checkout --detach "$ANYJEV_SOURCE_REV"
          observed=$(git -C "$ANYJEV_DIR" rev-parse HEAD)
          test "$observed" = "$ANYJEV_SOURCE_REV"
          python -m pip install --no-deps "./$ANYJEV_DIR"

          end_ms=$(date +%s%3N)
          echo "INSTALL_MS=$((end_ms-start_ms))" >> "$GITHUB_ENV"
          python -m pip freeze | sort > "$ARTIFACT_DIR/pip-freeze.txt"

          if grep -E '^(nvidia-|triton==)' "$ARTIFACT_DIR/pip-freeze.txt"; then
            echo "unexpected CUDA runtime package" >&2
            exit 2
          fi

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          observed = subprocess.check_output(
              ["git", "-C", os.environ["ANYJEV_DIR"], "rev-parse", "HEAD"],
              text=True,
          ).strip()
          target = Path("artifacts/anyjev-resolution.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(
                  {
                      "repository": "https://github.com/nokia-applied-research/AnyJev",
                      "requested_revision": os.environ["ANYJEV_SOURCE_REV"],
                      "observed_revision": observed,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Download and verify exact base-model snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MODEL_DIR"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from huggingface_hub import HfApi, snapshot_download

          repo = os.environ["BASE_MODEL_REPO"]
          revision = os.environ["BASE_MODEL_REV"]
          info = HfApi().model_info(repo, revision=revision)
          if info.sha != revision:
              raise SystemExit(f"model revision mismatch: {info.sha} != {revision}")

          path = snapshot_download(
              repo_id=repo,
              revision=revision,
              local_dir=os.environ["MODEL_DIR"],
              allow_patterns=["*.json", "*.safetensors", "*.model", "*.txt", "*.jinja"],
          )

          target = Path("artifacts/model-resolution.json")
          target.write_text(
              json.dumps(
                  {
                      "repository": repo,
                      "requested_revision": revision,
                      "observed_revision": info.sha,
                      "local_dir": str(path),
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run preregistered raw and L0 replay offline
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          python3 scripts/run_anyjev_hbr1.py \
            --manifest "$HBR1_MANIFEST" \
            --model-dir "$MODEL_DIR" \
            --anyjev-resolution "$ARTIFACT_DIR/anyjev-resolution.json" \
            --model-resolution "$ARTIFACT_DIR/model-resolution.json" \
            --out "$ARTIFACT_DIR/anyjev-hbr1-receipt.json"

          python -m json.tool "$ARTIFACT_DIR/anyjev-hbr1-receipt.json" >/dev/null

      - name: Write execution metadata
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          target = Path("artifacts/anyjev-hbr1-execution.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(
                  {
                      "schema": "theseus.anyjev-hbr1-execution.v1",
                      "claim_scope": "ADVISORY_HISTORICAL_BLIND_REPLAY_ONLY",
                      "repository_sha": os.environ.get("GITHUB_SHA"),
                      "run_id": os.environ.get("GITHUB_RUN_ID"),
                      "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                      "anyjev_source_revision": os.environ["ANYJEV_SOURCE_REV"],
                      "base_model_revision": os.environ["BASE_MODEL_REV"],
                      "install_ms": (
                          int(os.environ["INSTALL_MS"])
                          if os.environ.get("INSTALL_MS")
                          else None
                      ),
                      "outcome_escrow_consumed": False,
                      "acceptance_authority": False,
                      "permission_authority": False,
                      "verification_authority": False,
                      "promotion_authority": False,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload HBR-1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anyjev-hbr1-evidence
          path: |
            artifacts/runtime.json
            artifacts/anyjev-resolution.json
            artifacts/model-resolution.json
            artifacts/anyjev-hbr1-receipt.json
            artifacts/anyjev-hbr1-execution.json
            artifacts/pip-freeze.txt
          if-no-files-found: warn
          retention-days: 14
